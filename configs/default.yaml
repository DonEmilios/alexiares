# Default Alexiares configuration.
# Copy to ~/.alexiares/config.yaml to override.
# allow_private_networks defaults to false: the collector refuses to
# connect to loopback, private (RFC 1918), link-local, or multicast
# addresses, since Alexiares scans attacker-controlled targets that
# could otherwise use DNS or a redirect to reach this host's own
# network. Only set this true to intentionally scan your own internal
# infrastructure.
network:
  timeout: 10
  user_agent: Alexiares/0.1
  allow_private_networks: false
signatures:
  path: ~/.alexiares/signatures
output:
  format: terminal
# `alexiares update` refuses to run until both fields below are set.
# There is no default update source: self-hosting maintainers publish
# signatures.tar.gz + signatures.tar.gz.sig at a URL of their choosing
# and configure trust in that source explicitly, here.
update:
  source_url: ""
  public_key: ""
